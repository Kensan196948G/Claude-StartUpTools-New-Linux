  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"ja\"><head>\n<meta charset=\"utf-8\">\n<title>ClaudeOS スタートアップ 統合コンソール<\u002Ftitle>\n<script src=\"56df457b-c9c3-4a71-b8a1-483cb951080f\"><\u002Fscript>\n<style>:root {\n  color-scheme: light;\n  --bg: #f5f6f8;\n  --panel: #ffffff;\n  --border: #e2e5eb;\n  --text: #1a1d23;\n  --muted: #6b7280;\n  --accent: #2563eb;\n  --danger: #dc2626;\n  --warn: #d97706;\n  --ok: #16a34a;\n  font-family: -apple-system, \"Segoe UI\", \"Hiragino Sans\", \"Noto Sans JP\", sans-serif;\n}\n\n* { box-sizing: border-box; }\nbody { margin: 0; background: var(--bg); color: var(--text); }\n\n.layout { display: flex; min-height: 100vh; }\n\n.sidebar {\n  width: 220px;\n  flex-shrink: 0;\n  background: var(--panel);\n  border-right: 1px solid var(--border);\n  padding: 16px 0;\n}\n.sidebar h1 { font-size: 15px; padding: 0 16px 12px; margin: 0; }\n.sidebar nav a {\n  display: block;\n  padding: 8px 16px;\n  color: var(--text);\n  text-decoration: none;\n  font-size: 14px;\n}\n.sidebar nav a.active, .sidebar nav a:hover { background: #eef2ff; color: var(--accent); }\n\n.main { flex: 1; min-width: 0; }\n.topbar {\n  display: flex; justify-content: space-between; align-items: center;\n  padding: 10px 24px; border-bottom: 1px solid var(--border); background: var(--panel);\n}\n.content { padding: 24px; }\n\n.card {\n  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;\n  padding: 16px; margin-bottom: 16px;\n}\n\n.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }\n.kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }\n.kpi .value { font-size: 26px; font-weight: 700; }\n.kpi .label { font-size: 12px; color: var(--muted); }\n\ntable { width: 100%; border-collapse: collapse; font-size: 14px; }\nth, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }\nth { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }\ntr:hover td { background: #fafbfc; }\n\n.badge {\n  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;\n  background: #eef2ff; color: var(--accent);\n}\n.badge.risk-LOW { background: #ecfdf5; color: var(--ok); }\n.badge.risk-MEDIUM { background: #fffbeb; color: var(--warn); }\n.badge.risk-HIGH, .badge.risk-CRITICAL { background: #fef2f2; color: var(--danger); }\n.badge.status-COMPLETED, .badge.status-APPROVED, .badge.status-ACTIVE, .badge.status-CLOSED { background: #ecfdf5; color: var(--ok); }\n.badge.status-FAILED, .badge.status-REJECTED, .badge.status-DENIED { background: #fef2f2; color: var(--danger); }\n.badge.status-PENDING, .badge.status-RUNNING, .badge.status-AWAITING_APPROVAL, .badge.status-OPEN { background: #fffbeb; color: var(--warn); }\n\n.error-banner { background: #fef2f2; border: 1px solid #fecaca; color: var(--danger); padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }\n.muted { color: var(--muted); }\n.link { color: var(--accent); text-decoration: none; }\n.link:hover { text-decoration: underline; }\n\nbutton {\n  font-family: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px;\n  border: 1px solid var(--border); background: var(--panel); cursor: pointer;\n}\nbutton.primary { background: var(--accent); color: white; border-color: var(--accent); }\nbutton.danger { background: var(--danger); color: white; border-color: var(--danger); }\nbutton:disabled { opacity: 0.5; cursor: not-allowed; }\n\n.timeline { list-style: none; margin: 0; padding: 0; }\n.timeline li { padding: 6px 0 6px 16px; border-left: 2px solid var(--border); margin-left: 6px; font-size: 13px; }\n\n<\u002Fstyle>\n<style>:root {\n  color-scheme: light;\n  --bg: #f5f6f8;\n  --panel: #ffffff;\n  --border: #e2e5eb;\n  --text: #1a1d23;\n  --muted: #6b7280;\n  --accent: #2563eb;\n  --danger: #dc2626;\n  --warn: #d97706;\n  --ok: #16a34a;\n  font-family: -apple alized）<\u002Foption>\n<option value=\"pr-babysit\">pr-babysit（specialized）<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size: 12px; color: var(--muted)\">空欄 = 既定値。0 = 無制限は foreground / team のみ指定できます。<\u002Fspan>\n\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"f-intent\" style=\"font-size: 12px; font-weight: 500; color: var(--muted)\">要求 / Request（任意 — Goal Router の Evidence になります）<\u002Flabel>\n<textarea id=\"f-intent\" rows=\"3\" value=\"{{ intent }}\" sc-camel-on-change=\"{{ onIntent }}\" placeholder=\"例: CI が失敗しているので直して / 全体を評価して\" style=\"padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--inset); color: var(--text); font-size: 13px; line-height: 1.6; box-sizing: border-box; width: 100%; resize: vertical\"><\u002Ftextarea>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ doPlan }}\" disabled=\"{{ planDisabled }}\" style=\"min-height: 44px; padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text); background: var(--btn); border: 1px solid var(--btn-bd); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-eye\"><\u002Fuse><\u002Fsvg>1. 計画を確認（--dry-run）<\u002Fbutton>\n<button type=\"button\" class=\"primary\" sc-camel-on-click=\"{{ doLaunch }}\" disabled=\"{{ launchDisabled }}\" style=\"min-height: 44px; padding: 8px 18px; font-size: 13px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-play\"><\u002Fuse><\u002Fsvg>2. 起動実行<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ busyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"display: flex; flex-direction: column; gap: 6px\">\n<spa f=\"#i-terminal\"><\u002Fuse><\u002Fsvg><\u002Fspan>セッション<\u002Fh1>\n<p style=\"margin: 0; color: var(--muted)\">実行中の Claude Code セッションへプロンプトを送り、応答をストリーミングで確認します。<\u002Fp>\n<\u002Fdiv>\n\n<section class=\"card\" style=\"margin: 0; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<h2 style=\"margin: 0; font-size: 13px; font-weight: 700\">送信先<\u002Fh2>\n<sc-for list=\"{{ pSessions }}\" as=\"ps\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{ ps.pick }}\" aria-pressed=\"{{ ps.on }}\" style=\"display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 14px; font-size: 12px; border-radius: 999px; border: 1px solid {{ ps.border }}; background: {{ ps.bg }}; color: var(--text)\">\n<span class=\"eq\" aria-hidden=\"true\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; overflow-wrap: anywhere\">{{ ps.name }}<\u002Fspan>\n<span style=\"color: var(--muted)\">{{ ps.modeLabel }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ pNone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px\">\n<span style=\"color: var(--muted)\">実行中のセッションがありません。先にプロジェクトを起動してください。<\u002Fspan>\n<button type=\"button\" class=\"primary\" sc-camel-on-click=\"{{ go.launch }}\" style=\"min-height: 40px; padding: 8px 16px; font-size: 13px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-play\"><\u002Fuse><\u002Fsvg>起動画面を開く<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ pHas }}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"card composer\" style=\"margin: 0; padding: 0; display: flex; flex-direct (--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ pMaxIcon }}\"><\u002Fuse><\u002Fsvg>{{ pMaxLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<div class=\"thread\" aria-live=\"polite\" style=\"flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 18px 18px 22px; font-size: 15px; line-height: 1.7; background: var(--bg)\">\n<sc-if value=\"{{ pEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; flex: 1 1 auto; min-height: 200px; padding: 24px; text-align: center\">\n<span class=\"wave\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-terminal\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n<strong style=\"font-size: 14px\">このセッションへの最初のプロンプトを送ってください<\u002Fstrong>\n<span style=\"max-width: 460px; color: var(--muted)\">下の入力欄に指示を書いて送信すると、応答とイベントがここに流れます。<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-for list=\"{{ pRows }}\" as=\"r\" hint-placeholder-count=\"0\">\n<sc-if value=\"{{ r.isUser }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"msg\" style=\"display: flex; justify-content: flex-end; gap: 10px\">\n<div style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: min(960px, 88%)\">\n<div style=\"padding: 12px 18px; border: 1px solid var(--sel-bd2); border-radius: 14px 14px 4px 14px; background: var(--sel-bg); white-space: pre-wrap; overflow-wrap: anywhere\">{{ r.text }}<\u002Fdiv>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted)\">{{ r.t }}<\u002Fspan>\n<\u002Fdiv>\n<span class=\"tile\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-user\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ r.isEvent }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"msg\" style=\"display: flex; align-items: center; gap: 8px; padding-left: 42px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">\n<svg class=\"{{ r.icClass }}\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\" style=\"color: {{ r.color }}\"><use href=\"{{ r.icon }}\"><\u002Fuse><\u002Fsvg>\n<strong style=\"color: {{ r.color }}\">{{ r.label }}<\u002Fstrong>\n<span style=\"color: var(--muted); overflow-wrap: anywhere\">{{ r.detail }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ r.isTyping }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"msg\" style=\"display: flex; align-items: flex-start; gap: 10px\">\n<span class=\"tile\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-bot\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n<div role=\"status\" aria-label=\"応答を待っています\" style=\"padding: 10px 16px; border: 1px solid var(--border); border-radius: 14px 14px 14px 4px; background: var(--panel)\"><span class=\"dots\" aria-hidden=\"true\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ r.isBot }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"msg\" style=\"display: flex; align-items: flex-start; gap: 10px\">\n<span class=\"tile\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-bot\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px; max-width: min(1040px, 90%)\">\n<div style=\"padding: 12px 18px; border: 1px solid var(--border); border-radius: 14px 14px 14px 4px; background: var(--panel); white-space: pre-wrap; overflow-wrap: anywhere\">{{ r.text }}<sc-if value=\"{{ r.caret }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"caret\" aria-hidden=\"true\"><\u002Fspan><\u002Fsc-if><\u002Fdiv>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted)\">{{ r.t }} {{ r.note }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--border); background: var(--panel)\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<sc-for list=\"{{ pQuick }}\" as=\"q\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{ q.use }}\" style=\"min-height: 36px; padding: 5px 12px; font-size: 12px; color: var(--text-2); background: var(--sub); border: 1px solid var(--border); border-radius: 999px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\" style=\"color: var(--link)\"><use href=\"#i-zap\"><\u002Fuse><\u002Fsvg>{{ q.text }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<textarea id=\"f-prompt\" aria-label=\"プロンプト\" rows=\"3\" value=\"{{ pText }}\" sc-camel-on-change=\"{{ onPText }}\" sc-camel-on-key-down=\"{{ onPKey }}\" placeholder=\"Claude Code への指示を入力してください（Ctrl + Enter で送信）\" style=\"padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--inset); color: var(--text); font-size: 15px; line-height: 1.6; box-sizing: border-box; width: 100%; resize: vertical\"><\u002Ftextarea>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 6px\">\n<label for=\"f-pmodel\" style=\"font-size: 12px; font-weight: 500; color: var(--muted)\">モデル<\u002Flabel>\n<sc-raw-select id=\"f-pmodel\" value=\"{{ pModel }}\" sc-camel-on-change=\"{{ onPModel }}\" style=\"min-height: 40px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--inset); color: var(--text); font-size: 13px\">\n<option value=\"auto\">auto（Model Router）<\u002Foption>\n<option value=\"opus\">opus<\u002Foption>\n<option value=\"sonnet\">sonnet<\u002Foption>\n<option value=\"haiku\">haiku<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\" style=\"color: var(--muted)\"><use href=\"#i-lock\"><\u002Fuse><\u002Fsvg>permission-mode: auto<\u002Fspan>\n<span style=\"flex-grow: 1; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted)\">{{ pCount }} 文字<\u002Fspan>\n<sc-if value=\"{{ pBusy }}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ pStop }}\" style=\"min-height: 44px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--danger-t2); background: var(--danger-bg); border: 1px solid var(--danger-bd); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-stop\"><\u002Fuse><\u002Fsvg>中断<\u002Fbutton>\n<\u002Fsc-if>\n<button type=\"button\" class=\"{{ pSendClass }}\" sc-camel-on-click=\"{{ pSend }}\" disabled=\"{{ pSendDisabled }}\" style=\"min-height: 44px; padding: 8px 22px; font-size: 14px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 8px\"><svg class=\"{{ pSendIc }}\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ pSendIcon }}\"><\u002Fuse><\u002Fsvg>{{ pSendLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<pre style=\"margin: 0; padding: 8px 12px; background: var(--inset); border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2)\">{{ pCli }}<\u002Fpre>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<!-- ============ セッション監視 ============ -->\n<sc-if value=\"{{ is.sessions }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h1 style=\"margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px\"><span class=\"tile pop\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ screenIcon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>セッション状態監視<\u002Fh1>\n<p style=\"margin: 0; color: var(--muted)\">実行中の claudeos-* セッションの稼働・経過・残り時間を一覧します。接続は tmux 側で行います。<\u002Fp>\n<\u002Fdiv>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"overflow-x: auto\">\n<div style=\"min-width: 980px; display: flex; flex-direction: column\">\n<div style=\"display: grid; grid-template-columns: minmax(240px, 2fr) 150px 150px 80px 80px 110px 260px; gap: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--muted)\">\n<span>セッション<\u002Fspan><span>モード<\u002Fspan><span>Goal<\u002Fspan><span>経過<\u002Fspan><span>残り<\u002Fspan><span>状態<\u002Fspan><span>操作<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{ sessions }}\" as=\"s\" hint-placeholder-count=\"2\">\n<div style=\"display: grid; grid-template-columns: minmax(240px, 2fr) 150px 150px 80px 80px 110px 260px; gap: 12px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border)\">\n<span style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n<span style=\"display: flex; align-items: center; gap: 8px; min-width: 0\"><span class=\"eq\" aria-hidden=\"true\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan><span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere\">{{ s.name }}<\u002Fspan><\u002Fspan>\n<span class=\"{{ s.barClass }}\" aria-hidden=\"true\"><i style=\"width: {{ s.pct }}\"><\u002Fi><\u002Fspan>\n<\u002Fspan>\n<span>{{ s.modeLabel }}<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ s.goal }}<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ s.elapsed }}<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ s.remain }}<\u002Fspan>\n<span><x-import component-from-global-scope=\"MCAP.Badge\" kind=\"status\" value=\"RUNNING\"><\u002Fx-import><\u002Fspan>\n<span style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<button type=\"button\" class=\"primary\" sc-camel-on-click=\"{{ s.openPrompt }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-terminal\"><\u002Fuse><\u002Fsvg>プロンプト<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ s.showLog }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-file\"><\u002Fuse><\u002Fsvg>ログ<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ s.stop }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-stop\"><\u002Fuse><\u002Fsvg>停止<\u002Fbutton>\n<button type=\"button\" class=\"danger\" sc-camel-on-click=\"{{ s.kill }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-zap\"><\u002Fuse><\u002Fsvg>即停止<\u002Fbutton>\n<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ sessNone }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; color: var(--muted)\">実行中のセッションはありません。<\u002Fp>\n<\u002Fsc-if>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px\">\n<span style=\"color: var(--muted)\">接続（Ctrl-b d でデタッチ = BG 継続）:<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">tmux attach -t claudeos-&lt;project&gt;<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n<sc-if value=\"{{ logOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700; overflow-wrap: anywhere\">ログ: {{ logTitle }}<\u002Fh2>\n<button type=\"button\" sc-camel-on-click=\"{{ logClose }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-x\"><\u002Fuse><\u002Fsvg>閉じる<\u002Fbutton>\n<\u002Fdiv>\n<pre style=\"margin: 0; padding: 12px 14px; background: var(--inset); border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2)\">{{ logText }}<\u002Fpre>\n<\u002Fsection>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<!-- ============ Supervisor 全適用 ============ -->\n<sc-if value=\"{{ is.applyall }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h1 style=\"margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px\"><span class=\"tile pop\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ screenIcon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>Supervisor 全適用<\u002Fh1>\n<p style=\"margin: 0; color: var(--muted)\">全登録候補を Supervisor 管理へ移します。対象と skip 理由を確認し、人間が最終判断します。<\u002Fp>\n<\u002Fdiv>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n<ol class=\"timeline\">\n<li>計画を確認（<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">bash bin/autonomy.sh start --all --dry-run<\u002Fspan>）<\u002Fli>\n<li>対象と skip 理由を人間が確認<\u002Fli>\n<li>実行（<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">bash bin/autonomy.sh start --all --yes<\u002Fspan>）<\u002Fli>\n<\u002Fol>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ allPlan }}\" style=\"min-height: 44px; padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text); background: var(--btn); border: 1px solid var(--btn-bd); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-eye\"><\u002Fuse><\u002Fsvg>1. 計画を確認（--dry-run）<\u002Fbutton>\n<sc-if value=\"{{ allPlanned }}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"color: var(--muted)\">対象 <strong style=\"color: var(--text)\">{{ allTargetCount }}<\u002Fstrong> 件 / skip <strong style=\"color: var(--text)\">{{ allSkipCount }}<\u002Fstrong> 件<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{ allPlanned }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; max-height: 420px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px\">\n<sc-for : 8px 10px; border-bottom: 1px solid var(--border)\">\n<input type=\"checkbox\" aria-label=\"{{ c.selLabel }}\" checked=\"{{ c.checked }}\" sc-camel-on-change=\"{{ c.toggle }}\" style=\"width: 20px; height: 20px; accent-color: var(--accent)\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ c.id }}<\u002Fspan>\n<span style=\"font-weight: 500; overflow-wrap: anywhere\">{{ c.project }}<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ c.time }}<\u002Fspan>\n<span>{{ c.dowLabel }}<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ c.durLabel }}<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ c.goalLabel }}<\u002Fspan>\n<span style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<button type=\"button\" sc-camel-on-click=\"{{ c.runNow }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-play\"><\u002Fuse><\u002Fsvg>今すぐ実行<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ c.remove }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--danger-t2); background: var(--danger-bg); border: 1px solid var(--danger-bd); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-trash\"><\u002Fuse><\u002Fsvg>削除<\u002Fbutton>\n<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ cronNone }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; color: var(--muted)\">登録された CLAUDEOS cron エントリはありません。<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsection>\n\n<section class=\"c abel }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 0 1 130px; display: flex; flex-direction: column; gap: 4px\">\n<label for=\"f-cdur\" style=\"font-size: 12px; font-weight: 500; color: var(--muted)\">実行時間（分）<\u002Flabel>\n<input id=\"f-cdur\" type=\"text\" inputmode=\"numeric\" value=\"{{ cfDuration }}\" sc-camel-on-change=\"{{ onCfDuration }}\" style=\"min-height: 40px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--inset); color: var(--text); font-size: 13px; box-sizing: border-box; width: 100%\">\n<\u002Fdiv>\n<div style=\"flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px\">\n<label for=\"f-cgoal\" style=\"font-size: 12px; font-weight: 500; color: var(--muted)\">goal-type（任意・one-shot）<\u002Flabel>\n<sc-raw-select id=\"f-cgoal\" value=\"{{ cfGoal }}\" sc-camel-on-change=\"{{ onCfGoal }}\" style=\"min-height: 40px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--inset); color: var(--text); font-size: 13px; box-sizing: border-box; width: 100%\">\n<option value=\"\">指定なし（Goal Router）<\u002Foption>\n<option value=\"pr-babysit\">pr-babysit<\u002Foption>\n<option value=\"safe-auto-merge\">safe-auto-merge<\u002Foption>\n<option value=\"refactoring\">refactoring<\u002Foption>\n<option value=\"hotfix\">hotfix<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<button type=\"button\" class=\"primary\" sc-camel-on-click=\"{{ cronAdd }}\" disabled=\"{{ cronAddDisabled }}\" style=\"min-height: 44px; padding: 8px 18px; font-size: 13px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-plus\"><\u002Fuse><\u002Fsvg>登録<\u002Fbutton>\n<\u002Fdiv>\n<pre style=\"margin: 0; padding: 12px 14px; background: var(--inset); border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2)\">{{ cronCmd }}<\u002Fpre>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ Systemd ============ -->\n<sc-if value=\"{{ is.systemd }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h1 style=\"margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px\"><span class=\"tile pop\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ screenIcon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>Systemd 起動管理<\u002Fh1>\n<p style=\"margin: 0; color: var(--muted)\">登録プロジェクトを systemd --user サービスとして生成・起動・自動起動します。<\u002Fp>\n<\u002Fdiv>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700\">台帳（登録プロジェクト）<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ sdScan }}\" style=\"min-height: 40px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-search\"><\u002Fuse><\u002Fsvg>走査（scan）<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ sdStartAll }}\" style=\"min-height: 40px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-play\"><\u002Fuse><\u002Fsvg>enabled 一括起動（start-all）<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"overflow-x: auto\">\n<div style=\"min-width: 940px; display: flex; flex-direction: column\">\n<div style=\"display: grid; grid-template-columns: minmax(200px, 2fr) 130px 110px 100px 380px; gap: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--muted)\">\n<span>プロジェクト<\u002Fspan><span>コマンド<\u002Fspan><span>状態<\u002Fspan><span>自動起動<\u002Fspan><span>操作<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{ units }}\" as=\"u\" hint-placeholder-count=\"2\">\n<div style=\"display: grid; grid-template-columns: minmax(200px, 2fr) 130px 110px 100px 380px; gap: 12px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--border)\">\n<span style=\"font-weight: 500; overflow-wrap: anywhere\">{{ u.name }}<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ u.command }}<\u002Fspan>\n<span><x-import component-from-global-scope=\"MCAP.Badge\" kind=\"status\" value=\"{{ u.badge }}\"><\u002Fx-import><\u002Fspan>\n<span>{{ u.enabledLabel }}<\u002Fspan>\n<span style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<button type=\"button\" sc-camel-on-click=\"{{ u.toggleRun }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px\">{{ u.runLabel }}<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ u.toggleEnable }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px\">{{ u.enableBtn }}<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ u.logs }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-file\"><\u002Fuse><\u002Fsvg>ログ<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ u.unregister }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--danger-t2); background: var(--danger-bg); border: 1px solid var(--danger-bd); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-trash\"><\u002Fuse><\u002Fsvg>登録解除<\u002Fbutton>\n<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ unitsNone }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; color: var(--muted)\">台帳に登録されたプロジェクトはありません。走査して登録してください。<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsection>\n<sc-if value=\"{{ scanOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 10px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700\">走査結果（未登録の候補）<\u002Fh2>\n<sc-for list=\"{{ scanRows }}\" as=\"sc\" hint-placeholder-count=\"2\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border)\">\n<span style=\"flex: 1 1 240px; font-weight: 500; overflow-wrap: anywhere\">{{ sc.name }}<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--muted)\">推定コマンド: <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--text)\">{{ sc.command }}<\u002Fspan><\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ sc.register }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-plus\"><\u002Fuse><\u002Fsvg>台帳登録<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ scanNone }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; color: var(--muted)\">未登録の候補はありません。<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{ sdOutOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<pre style=\"margin: 0; padding: 12px 14px; background: var(--inset); border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2)\">{{ sdOut }}<\u002Fpre>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<!-- ============ Agent Teams 管理 ============ -->\n<sc-if value=\"{{ is.teams }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h1 style=\"margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px\"><span class=\"tile pop\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ screenIcon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>Agent Teams 管理<\u002Fh1>\n<p style=\"margin: 0; color: var(--muted)\">CTO をハブに複数役割で動かすチームの稼働・パターン・計測を管理します。チームは監視と観測の対象で、意思決定は CTO が行います。<\u002Fp>\n<\u002Fdiv>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700\">稼働中のチーム<\u002Fh2>\n<button type=\"button\" class=\"primary\" sc-camel-on-click=\"{{ atLaunch }}\" style=\"min-height: 40px; padding: 8px 16px; font-size: 13px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-users\"><\u002Fuse><\u002Fsvg>4役割一括で起動（起動画面へ）<\u002Fbutton>\n<\u002Fdiv>\n<sc-for list=\"{{ teamRows }}\" as=\"tm\" hint-placeholder-count=\"1\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--sub)\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n<strong style=\"flex: 1 1 240px; overflow-wrap: anywhere\">{{ tm.project }}<\u002Fstrong>\n<x-import component-from-global-scope=\"MCAP.Badge\" kind=\"status\" value=\"RUNNING\"><\u002Fx-import>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted)\">経過 {{ tm.elapsed }}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ tm.stop }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-stop\"><\u002Fuse><\u002Fsvg>停止<\u002Fbutton>\n<button type=\"button\" class=\"danger\" sc-camel-on-click=\"{{ tm.kill }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-zap\"><\u002Fuse><\u002Fsvg>即停止<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 8px\">\n<div style=\"display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 1px solid var(--sel-bd2); border-radius: 6px; background: var(--panel)\">\n<strong style=\"font-size: 13px\">cto<\u002Fstrong>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted); overflow-wrap: anywhere\">{{ tm.sCto }}<\u002Fspan>\n<span style=\"display: flex; flex-direction: column; gap: 2px; min-height: 52px; margin-top: 4px; padding: 6px 8px; border-radius: 4px; background: var(--inset); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--text-2)\">\n<span class=\"type\">$ TEAM_START_PROMPT を注入<\u002Fspan>\n<span class=\"type d2\">→ SendMessage: backend / frontend / qa<\u002Fspan>\n<span><span class=\"caret\" aria-hidden=\"true\"><\u002Fspan><\u002Fspan>\n<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel)\">\n<strong style=\"font-size: 13px\">backend<\u002Fstrong>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted); overflow-wrap: anywhere\">{{ tm.sBackend }}<\u002Fspan>\n<span style=\"display: flex; flex-direction: column; gap: 2px; min-height: 52px; margin-top: 4px; padding: 6px 8px; border-radius: 4px; background: var(--inset); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--text-2)\">\n<span class=\"type d3\">… CTO の指示を待機中<\u002Fspan>\n<span><span class=\"caret\" aria-hidden=\"true\"><\u002Fspan><\u002Fspan>\n<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel)\">\n<strong style=\"font-size: 13px\">frontend<\u002Fstrong>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted); overflow-wrap: anywhere\">{{ tm.sFrontend }}<\u002Fspan>\n<span style=\"display: flex; flex-direction: column; gap: 2px; min-height: 52px; margin-top: 4px; padding: 6px 8px; border-radius: 4px; background: var(--inset); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--text-2)\">\n<span class=\"type d3\">… CTO の指示を待機中<\u002Fspan>\n<span><span class=\"caret\" aria-hidden=\"true\"><\u002Fspan><\u002Fspan>\n<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel)\">\n<strong style=\"font-size: 13px\">qa<\u002Fstrong>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted); overflow-wrap: anywhere\">{{ tm.sQa }}<\u002Fspan>\n<span style=\"display: flex; flex-direction: column; gap: 2px; min-height: 52px; margin-top: 4px; padding: 6px 8px; border-radius: 4px; background: var(--inset); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--text-2)\">\n<span class=\"type d3\">… CTO の指示を待機中<\u002Fspan>\n<span><span class=\"caret\" aria-hidden=\"true\"><\u002Fspan><\u002Fspan>\n<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size: 11px; color: var(--muted)\">ペイン内の表示は動作イメージです（実機では tmux の各ペインに Claude の出力が流れます）。<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 12px\">\n<span><span style=\"color: var(--muted)\">Teammate spawn<\u002Fspan> <strong style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">{{ tm.spawn }}<\u002Fstrong><\u002Fspan>\n<span><span style=\"color: var(--muted)\">SendMessage<\u002Fspan> <strong style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">{{ tm.msg }}<\u002Fstrong><\u002Fspan>\n<span><span style=\"color: var(--muted)\">使用パターン<\u002Fspan> <strong style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">{{ tm.pat }}<\u002Fstrong><\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; overflow-wrap: anywhere\">$ {{ tm.attach }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ teamNone }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; color: var(--muted)\">稼働中のチームはありません。<\u002Fp>\n<\u002Fsc-if>\n<span style=\"font-size: 12px; color: var(--muted)\">初期プロンプトは CTO ペインにのみ注入され、backend / frontend / qa は CTO からの指示待ちで開始します（4 ペイン同時の自律実行はクレジット消費が 4 倍になるため）。<\u002Fspan>\n<\u002Fsection>\n\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700\">チームパターン<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--sub)\">\n<div style=\"display: flex; align-items: center; gap: 8px\"><span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; padding: 1px 6px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); background: var(--inset)\">A<\u002Fspan><strong>並列実装<\u002Fstrong><\u002Fdiv>\n<span style=\"font-size: 12px; color: var(--muted)\">複数機能の同時開発<\u002Fspan>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 12px\">\n<li>Lead: CTO（統制・統合）<\u002Fli>\n<li>Backend 実装（API / DB / ロジック）<\u002Fli>\n<li>Frontend 実装（UI / UX）<\u002Fli>\n<li>テスト設計・検証<\u002Fli>\n<\u002Ful>\n<span style=\"font-size: 12px; color: var(--link)\">推奨フェーズ: Build / Development<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--sub)\">\n<div style=\"display: flex; align-items: center; gap: 8px\"><span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; padding: 1px 6px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); background: var(--inset)\">B<\u002Fspan><strong>品質強化<\u002Fstrong><\u002Fdiv>\n<span style=\"font-size: 12px; color: var(--muted)\">CI 失敗 + Security + テストの同時対応<\u002Fspan>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 12px\">\n<li>Lead: CTO（統制・判断）<\u002Fli>\n<li>バグ修復・CI 修復<\u002Fli>\n<li>セキュリティレビュー<\u002Fli>\n<li>回帰テスト<\u002Fli>\n<\u002Ful>\n<span style=\"font-size: 12px; color: var(--link)\">推奨フェーズ: Verify / Quality / Repair<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--sub)\">\n<div style=\"display: flex; align-items: center; gap: 8px\"><span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; padding: 1px 6px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); background: var(--inset)\">C<\u002Fspan><strong>調査・設計<\u002Fstrong><\u002Fdiv>\n<span style=\"font-size: 12px; color: var(--muted)\">大規模設計検討・多観点が必要な場面<\u002Fspan>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 12px\">\n<li>Lead: CTO（統制・意思決定）<\u002Fli>\n<li>技術調査<\u002Fli>\n<li>アーキテクチャ設計<\u002Fli>\n<li>Devil's Advocate（反証・リスク指摘）<\u002Fli>\n<\u002Ful>\n<span style=\"font-size: 12px; color: var(--link)\">推奨フェーズ: Monitor<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<span style=\"font-size: 12px; color: var(--muted)\">起動時にフェーズに応じた推奨パターンを CTO に提示します（強制ではなく指針）。<\u002Fspan>\n<\u002Fsection>\n\n<sc-if value=\"{{ atOutOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<pre style=\"margin: 0; padding: 12px 14px; background: var(--inset); border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2)\">{{ atOut }}<\u002Fpre>\n<\u002Fsc-if>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); gap: 16px; align-items: start\">\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column\">\n<h2 style=\"margin: 0 0 4px; font-size: 14px; font-weight: 700\">計測・診断<\u002Fh2>\n<sc-for list=\"{{ atTools }}\" as=\"ax\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border)\">\n<span class=\"tile\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-activity\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n<span style=\"flex: 1 1 240px; display: flex; flex-direction: column; min-width: 0\">\n<span style=\"font-weight: 500\">{{ ax.label }}<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--muted)\">{{ ax.note }}<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere\">{{ ax.cmd }}<\u002Fspan>\n<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--ok-t)\">{{ ax.ran }}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ ax.run }}\" style=\"min-height: 36px; padding: 5px 14px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-play\"><\u002Fuse><\u002Fsvg>実行<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column\">\n<h2 style=\"margin: 0 0 4px; font-size: 14px; font-weight: 700\">Backlog 振り分けルール<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 64px 110px; gap: 12px; padding: 8px 0; font-size: 12px; font-weight: 600; color: var(--muted)\">\n<span>パターン（正規表現）<\u002Fspan><span>優先度<\u002Fspan><span>担当<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{ atRules }}\" as=\"ru\" hint-placeholder-count=\"7\">\n<div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 64px 110px; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border)\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere\">{{ ru.pattern }}<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ ru.priority }}<\u002Fspan>\n<span>{{ ru.owner }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<span style=\"padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted)\">定義: <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">config/agent-teams-backlog-rules.json<\u002Fspan>（どれにも一致しない場合は既定の P2 / ScrumMaster）<\u002Fspan>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ SubAgent 管理 ============ -->\n<sc-if value=\"{{ is.subagents }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h1 style=\"margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px\"><span class=\"tile pop\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ screenIcon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>SubAgent 管理<\u002Fh1>\n<p style=\"margin: 0; color: var(--muted)\">Lazy Agent Catalog を管理します。first-class は .claude/agents へ配布され説明文が常時 context に載るため、最小限に保ちます。カタログは必要時にだけ読み込みます。<\u002Fp>\n<\u002Fdiv>\n<div class=\"kpi-grid\">\n<div class=\"kpi\"><div class=\"value\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">{{ saFirstCount }}<\u002Fdiv><div class=\"label\">first-class（常時配布）<\u002Fdiv><\u002Fdiv>\n<div class=\"kpi\"><div class=\"value\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">{{ saCatalogCount }}<\u002Fdiv><div class=\"label\">カタログ（必要時に読込）<\u002Fdiv><\u002Fdiv>\n<div class=\"kpi\"><div class=\"value\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">{{ saMergedCount }}<\u002Fdiv><div class=\"label\">統合済み（deprecated 保持）<\u002Fdiv><\u002Fdiv>\n<div class=\"kpi\"><div class=\"value\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">{{ saRemoveCount }}<\u002Fdiv><div class=\"label\">削除候補（人間判断待ち）<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); gap: 16px; align-items: start\">\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column\">\n<h2 style=\"margin: 0 0 4px; font-size: 14px; font-weight: 700\">first-class<\u002Fh2>\n<sc-for list=\"{{ saFirstRows }}\" as=\"sa\" hint-placeholder-count=\"9\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 0; border-top: 1px solid var(--border)\">\n<span style=\"flex: 1 1 240px; display: flex; flex-direction: column; min-width: 0\">\n<strong style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ sa.name }}<\u002Fstrong>\n<span style=\"font-size: 12px; color: var(--muted)\">{{ sa.desc }}<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--link)\">{{ sa.meta }}<\u002Fspan>\n<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ sa.move }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-down\"><\u002Fuse><\u002Fsvg>カタログへ降格<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ saFirstNone }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; padding: 8px 0; color: var(--muted)\">first-class の SubAgent はありません。<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsection>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column\">\n<h2 style=\"margin: 0 0 4px; font-size: 14px; font-weight: 700\">カタログ<\u002Fh2>\n<sc-for list=\"{{ saCatalogRows }}\" as=\"sa\" hint-placeholder-count=\"9\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 0; border-top: 1px solid var(--border)\">\n<span style=\"flex: 1 1 240px; display: flex; flex-direction: column; min-width: 0\">\n<strong style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ sa.name }}<\u002Fstrong>\n<span style=\"font-size: 12px; color: var(--muted)\">{{ sa.desc }}<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--link)\">{{ sa.meta }}<\u002Fspan>\n<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ sa.move }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-up\"><\u002Fuse><\u002Fsvg>first-class へ昇格<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ saCatalogNone }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; padding: 8px 0; color: var(--muted)\">カタログの SubAgent はありません。<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ saSeed }}\" style=\"min-height: 40px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-database\"><\u002Fuse><\u002Fsvg>カタログを control.agents へ反映（seed）<\u002Fbutton>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted)\">bash bin/seed-agent-catalog.sh<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); gap: 16px; align-items: start\">\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column\">\n<h2 style=\"margin: 0 0 4px; font-size: 14px; font-weight: 700\">統合済み<\u002Fh2>\n<sc-for list=\"{{ saMerged }}\" as=\"mg\" hint-placeholder-count=\"6\">\n<div style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--border)\">\n<strong style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere\">{{ mg.into }}<\u002Fstrong>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere\">{{ mg.from }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<span style=\"padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted)\">左の SubAgent が右の定義を吸収しています。吸収元は削除せず deprecated として保持します。<\u002Fspan>\n<\u002Fsection>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column\">\n<h2 style=\"margin: 0 0 4px; font-size: 14px; font-weight: 700\">削除候補<\u002Fh2>\n<sc-for list=\"{{ saRemove }}\" as=\"rm\" hint-placeholder-count=\"7\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 0; border-top: 1px solid var(--border)\">\n<span style=\"flex: 1 1 220px; display: flex; flex-direction: column; min-width: 0\">\n<strong style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ rm.name }}<\u002Fstrong>\n<span style=\"font-size: 12px; color: var(--muted)\">代替: {{ rm.reason }}<\u002Fspan>\n<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ rm.issue }}\" disabled=\"{{ rm.issued }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px\">{{ rm.btn }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<span style=\"padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted)\">破壊的な削除は人間が最終判断します。ここでは Issue 化までを行い、ファイルは削除しません。<\u002Fspan>\n<\u002Fsection>\n<\u002Fdiv>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700\">実行形態の判定（Agent Router）<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted)\">タスクの特性から Main / Subagent / BackgroundAgent / AgentView / AgentTeams / DynamicWorkflow のどれで実行するかを判定し、理由を記録します。<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end\">\n<div style=\"flex: 0 1 150px; display: flex; flex-direction: column; gap: 4px\">\n<label for=\"f-arc\" style=\"font-size: 12px; font-weight: 500; color: var(--muted)\">complexity<\u002Flabel>\n<sc-raw-select id=\"f-arc\" value=\"{{ arComplexity }}\" sc-camel-on-change=\"{{ onArComplexity }}\" style=\"min-height: 40px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--inset); color: var(--text); font-size: 13px; box-sizing: border-box; width: 100%\">\n<option value=\"low\">low<\u002Foption><option value=\"medium\">medium<\u002Foption><option value=\"high\">high<\u002Foption><option value=\"critical\">critical<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<div style=\"flex: 0 1 150px; display: flex; flex-direction: column; gap: 4px\">\n<label for=\"f-arr\" style=\"font-size: 12px; font-weight: 500; color: var(--muted)\">risk<\u002Flabel>\n<sc-raw-select id=\"f-arr\" value=\"{{ arRisk }}\" sc-camel-on-change=\"{{ onArRisk }}\" style=\"min-height: 40px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--inset); color: var(--text); font-size: 13px; box-sizing: border-box; width: 100%\">\n<option value=\"low\">low<\u002Foption><option value=\"medium\">medium<\u002Foption><option value=\"high\">high<\u002Foption><option value=\"critical\">critical<\u002Foption>\n<\u002Fsc-raw-select>\n<\u002Fdiv>\n<div style=\"flex: 0 1 120px; display: flex; flex-direction: column; gap: 4px\">\n<label for=\"f-arp\" style=\"font-size: 12px; font-weight: 500; color: var(--muted)\">parallelism<\u002Flabel>\n<input id=\"f-arp\" type=\"text\" inputmode=\"numeric\" value=\"{{ arParallel }}\" sc-camel-on-change=\"{{ onArParallel }}\" style=\"min-height: 40px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--inset); color: var(--text); font-size: 13px; box-sizing: border-box; width: 100%\">\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 8px; min-height: 44px\">\n<input id=\"f-aro\" type=\"checkbox\" checked=\"{{ arReadOnly }}\" sc-camel-on-change=\"{{ onArReadOnly }}\" style=\"width: 20px; height: 20px; accent-color: var(--accent)\">\n<label for=\"f-aro\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">read_only<\u002Flabel>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 8px; min-height: 44px\">\n<input id=\"f-arm\" type=\"checkbox\" checked=\"{{ arComm }}\" sc-camel-on-change=\"{{ onArComm }}\" style=\"width: 20px; height: 20px; accent-color: var(--accent)\">\n<label for=\"f-arm\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">needs_inter_agent_communication<\u002Flabel>\n<\u002Fdiv>\n<button type=\"button\" class=\"primary\" sc-camel-on-click=\"{{ arRun }}\" style=\"min-height: 44px; padding: 8px 18px; font-size: 13px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-route\"><\u002Fuse><\u002Fsvg>判定する<\u002Fbutton>\n<\u002Fdiv>\n<pre style=\"margin: 0; padding: 12px 14px; background: var(--inset); border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2)\">{{ arOut }}<\u002Fpre>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ Managed Agents ============ -->\n<sc-if value=\"{{ is.managed }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h1 style=\"margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px\"><span class=\"tile pop\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ screenIcon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>Managed Agents<\u002Fh1>\n<p style=\"margin: 0; color: var(--muted)\">Local Claude Code が主系。ここは低リスク・読取専用タスクをクラウドへ依頼する入口です（有効時のみ課金）。<\u002Fp>\n<\u002Fdiv>\n<div class=\"kpi-grid\">\n<div class=\"kpi\"><div class=\"value\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">{{ maMode }}<\u002Fdiv><div class=\"label\">モード（config/managed-agents.json）<\u002Fdiv><\u002Fdiv>\n<div class=\"kpi\"><div class=\"value\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">{{ maUsed }}¢ / 2000¢<\u002Fdiv><div class=\"label\">今月の予算（使用 / 上限）<\u002Fdiv><\u002Fdiv>\n<div class=\"kpi\"><div class=\"value\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">{{ maToday }} / 5 回<\u002Fdiv><div class=\"label\">本日の依頼（回数 / 上限）<\u002Fdiv><\u002Fdiv>\n<div class=\"kpi\"><div class=\"value\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">200¢<\u002Fdiv><div class=\"label\">1 回の上限<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 14px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700\">依頼する<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ maPick.review }}\" aria-pressed=\"{{ maOn.review }}\" style=\"flex: 1 1 220px; min-height: 76px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; text-align: left; border-radius: 8px; border: 1px solid {{ maStyle.review.border }}; background: {{ maStyle.review.bg }}; color: var(--text)\">\n<strong style=\"font-size: 13px\">リポジトリレビュー<\u002Fstrong>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted)\">repository-review<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--muted)\">README・設計資料・差分の整合性を評価<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ maPick.qa }}\" aria-pressed=\"{{ maOn.qa }}\" style=\"flex: 1 1 220px; min-height: 76px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; text-align: left; border-radius: 8px; border: 1px solid {{ maStyle.qa.border }}; background: {{ maStyle.qa.bg }}; color: var(--text)\">\n<strong style=\"font-size: 13px\">テスト・CI ログの解析<\u002Fstrong>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted)\">quality-assurance<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--muted)\">失敗原因と最小の修正案を報告<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ maPick.docs }}\" aria-pressed=\"{{ maOn.docs }}\" style=\"flex: 1 1 220px; min-height: 76px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; text-align: left; border-radius: 8px; border: 1px solid {{ maStyle.docs.border }}; background: {{ maStyle.docs.bg }}; color: var(--text)\">\n<strong style=\"font-size: 13px\">文書の更新案<\u002Fstrong>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: var(--muted)\">documentation<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--muted)\">README・運用手順・設計書の更新案を作成<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<label for=\"f-maprompt\" style=\"font-size: 12px; font-weight: 500; color: var(--muted)\">依頼内容（1 行）<\u002Flabel>\n<input id=\"f-maprompt\" type=\"text\" value=\"{{ maPrompt }}\" sc-camel-on-change=\"{{ onMaPrompt }}\" placeholder=\"例: docs/architecture と README の不整合を確認して\" style=\"min-height: 40px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--inset); color: var(--text); font-size: 13px; box-sizing: border-box; width: 100%\">\n<span style=\"font-size: 12px; color: var(--warn-t)\">依頼文はクラウドへ送信されます。秘密情報・個人情報・本番データは書かないでください。<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<button type=\"button\" class=\"primary\" sc-camel-on-click=\"{{ maSend }}\" disabled=\"{{ maSendDisabled }}\" style=\"min-height: 44px; padding: 8px 18px; font-size: 13px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-send\"><\u002Fuse><\u002Fsvg>依頼を確認する<\u002Fbutton>\n<span style=\"font-size: 12px; color: var(--muted)\">{{ maHint }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700\">依頼履歴（この画面での操作）<\u002Fh2>\n<sc-for list=\"{{ maLog }}\" as=\"m\" hint-placeholder-count=\"1\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border)\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted)\">{{ m.t }}<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ m.role }}<\u002Fspan>\n<span style=\"flex: 1 1 260px; overflow-wrap: anywhere\">{{ m.prompt }}<\u002Fspan>\n<span style=\"font-size: 12px; color: {{ m.color }}\">{{ m.result }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ maLogNone }}\" hint-placeholder-val=\"{{ true }}\">\n<p style=\"margin: 0; color: var(--muted)\">まだ依頼はありません。<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ 診断・ツール ============ -->\n<sc-if value=\"{{ is.diag }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h1 style=\"margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px\"><span class=\"tile pop\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ screenIcon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>診断・ツール<\u002Fh1>\n<p style=\"margin: 0; color: var(--muted)\">運用メニューの診断項目をそのまま実行します。キーは bin/menu.sh の番号と同じです。<\u002Fp>\n<\u002Fdiv>\n<sc-if value=\"{{ diagOutOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<pre style=\"margin: 0; padding: 12px 14px; background: var(--inset); border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2)\">{{ diagOut }}<\u002Fpre>\n<\u002Fsc-if>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column\">\n<sc-for list=\"{{ tools }}\" as=\"t\" hint-placeholder-count=\"8\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border)\">\n<span style=\"flex: 0 0 38px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; text-align: center; padding: 1px 4px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); background: var(--inset)\">{{ t.key }}<\u002Fspan>\n<span style=\"flex: 1 1 240px; font-weight: 500\">{{ t.label }}<\u002Fspan>\n<span style=\"flex: 1 1 300px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere\">{{ t.cmd }}<\u002Fspan>\n<span style=\"flex: 0 0 110px; font-size: 12px; color: var(--ok-t)\">{{ t.ran }}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ t.run }}\" style=\"min-height: 36px; padding: 5px 14px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-play\"><\u002Fuse><\u002Fsvg>実行<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ 品質ワークベンチ ============ -->\n<sc-if value=\"{{ is.quality }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h1 style=\"margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px\"><span class=\"tile pop\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ screenIcon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>品質ワークベンチ<\u002Fh1>\n<p style=\"margin: 0; color: var(--muted)\">プロジェクト単位でリリースチェック（複合ゲート）を実行し、AI 品質ゲートのマージ可能条件を確認します。修復は CTO Claude へ委任し、merge の最終判断は人間が行います。<\u002Fp>\n<\u002Fdiv>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700\">対象<\u002Fh2>\n<strong style=\"overflow-wrap: anywhere\">{{ qwName }}<\u002Fstrong>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; max-height: 132px; overflow-y: auto\">\n<sc-for list=\"{{ qwTargets }}\" as=\"qt\" hint-placeholder-count=\"8\">\n<button type=\"button\" sc-camel-on-click=\"{{ qt.pick }}\" aria-pressed=\"{{ qt.on }}\" style=\"min-height: 36px; padding: 5px 10px; font-size: 12px; border-radius: 6px; border: 1px solid {{ qt.border }}; background: {{ qt.bg }}; color: var(--text)\">{{ qt.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); gap: 16px; align-items: start\">\n\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700; flex-grow: 1\">リリースチェック（複合ゲート）<\u002Fh2>\n<sc-if value=\"{{ qwRan }}\" hint-placeholder-val=\"{{ false }}\">\n<x-import component-from-global-scope=\"MCAP.Badge\" kind=\"status\" value=\"{{ qwBadge }}\"><\u002Fx-import>\n<\u002Fsc-if>\n<span style=\"font-size: 12px; color: {{ qwSummaryColor }}\">{{ qwSummary }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 16px\">\n<sc-for list=\"{{ qwOptRows }}\" as=\"qo\" hint-placeholder-count=\"4\">\n<div style=\"display: flex; align-items: center; gap: 8px; min-height: 44px\">\n<input id=\"{{ qo.id }}\" type=\"checkbox\" checked=\"{{ qo.checked }}\" sc-camel-on-change=\"{{ qo.toggle }}\" style=\"width: 20px; height: 20px; accent-color: var(--accent)\">\n<label for=\"{{ qo.id }}\" style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">{{ qo.flag }}<\u002Flabel>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ qwDry }}\" style=\"min-height: 44px; padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text); background: var(--btn); border: 1px solid var(--btn-bd); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-eye\"><\u002Fuse><\u002Fsvg>解決コマンドを確認（--dry-run）<\u002Fbutton>\n<button type=\"button\" class=\"primary\" sc-camel-on-click=\"{{ qwRun }}\" style=\"min-height: 44px; padding: 8px 18px; font-size: 13px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-shield\"><\u002Fuse><\u002Fsvg>チェック実行<\u002Fbutton>\n<\u002Fdiv>\n<pre style=\"margin: 0; padding: 12px 14px; background: var(--inset); border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2)\">{{ qwCli }}<\u002Fpre>\n<div style=\"display: flex; flex-direction: column\">\n<sc-for list=\"{{ qwChecks }}\" as=\"qc\" hint-placeholder-count=\"6\">\n<div style=\"display: grid; grid-template-columns: 120px minmax(0, 1fr) 64px; gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--border)\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500\">{{ qc.name }}<\u002Fspan>\n<span style=\"display: flex; flex-direction: column; gap: 2px; min-width: 0\">\n<span>{{ qc.desc }}<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--muted); overflow-wrap: anywhere\">{{ qc.detail }}<\u002Fspan>\n<\u002Fspan>\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: flex-end; gap: 4px; color: {{ qc.color }}\"><sc-if value=\"{{ qc.busy }}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"ic spin\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-loader\"><\u002Fuse><\u002Fsvg><\u002Fsc-if>{{ qc.verdict }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"font-size: 12px; color: var(--muted)\">判定は OK / NG / SKIP。NG が 1 件でもあれば FAIL（終了コード 1）、SKIP は不合格にしません。<\u002Fspan>\n<sc-if value=\"{{ qwFailed }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--danger-bd); border-radius: 8px; background: var(--danger-bg)\">\n<strong style=\"color: var(--danger-t2)\">NG があります。修復を委任できます。<\u002Fstrong>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ qwRepair }}\" disabled=\"{{ qwIsSelf }}\" style=\"min-height: 40px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-arrow\"><\u002Fuse><\u002Fsvg>deep-debug で修復を委任（起動画面へ）<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ qwAskQa }}\" style=\"min-height: 40px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-cloud\"><\u002Fuse><\u002Fsvg>失敗の解析を Managed Agents へ依頼<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ qwIsSelf }}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"font-size: 12px; color: var(--warn-t)\">このリポジトリ自身は起動対象から自動除外されるため、起動画面への委任はできません。<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700; flex-grow: 1\">AI 品質ゲート（マージ可能条件）<\u002Fh2>\n<x-import component-from-global-scope=\"MCAP.Badge\" kind=\"status\" value=\"{{ qgBadge }}\"><\u002Fx-import>\n<\u002Fdiv>\n<p style=\"margin: 0; color: var(--muted)\">ClaudeCode・CodeRabbit・Codex の 3 層レビューを統合した条件です。全条件が必須で、満たしたうえで人間が merge を承認します。<\u002Fp>\n<div style=\"display: flex; flex-direction: column\">\n<sc-for list=\"{{ qgRows }}\" as=\"g\" hint-placeholder-count=\"6\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 44px; padding: 6px 0; border-top: 1px solid var(--border)\">\n<span style=\"flex: 1 1 220px; display: flex; flex-direction: column; min-width: 0\">\n<span style=\"font-weight: 500\">{{ g.label }}<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--muted); overflow-wrap: anywhere\">{{ g.source }}<\u002Fspan>\n<\u002Fspan>\n<sc-if value=\"{{ g.manual }}\" hint-placeholder-val=\"{{ true }}\">\n<span style=\"display: flex; align-items: center; gap: 8px\">\n<input id=\"{{ g.id }}\" type=\"checkbox\" checked=\"{{ g.checked }}\" sc-camel-on-change=\"{{ g.toggle }}\" style=\"width: 20px; height: 20px; accent-color: var(--accent)\">\n<label for=\"{{ g.id }}\" style=\"font-size: 12px\">人間が確認済み<\u002Flabel>\n<\u002Fspan>\n<\u002Fsc-if>\n<span style=\"flex: 0 0 64px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; text-align: right; color: {{ g.color }}\">{{ g.state }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"font-size: 12px; color: {{ qgColor }}\">{{ qgText }}<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ qwAssure }}\" disabled=\"{{ qwIsSelf }}\" style=\"min-height: 40px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-arrow\"><\u002Fuse><\u002Fsvg>product-assurance で総合品質保証を委任（起動画面へ）<\u002Fbutton>\n<\u002Fdiv>\n<span style=\"font-size: 12px; color: var(--muted)\">同一エラーの再修復は 2 回まで。3 回目は停止して Issue 化します。<\u002Fspan>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ デプロイ・保守 ============ -->\n<sc-if value=\"{{ is.deploy }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h1 style=\"margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px\"><span class=\"tile pop\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ screenIcon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>DevOps<\u002Fh1>\n<p style=\"margin: 0; color: var(--muted)\">デプロイ準備・保守モード移行・インシデント対応・週次レポートを扱います。リリース・配備・データ基盤・計測の運用コマンドもここから実行します。実デプロイは人間が手動で行います。<\u002Fp>\n<\u002Fdiv>\n<sc-if value=\"{{ dvOutOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<pre style=\"margin: 0; padding: 12px 14px; background: var(--inset); border: 1px solid var(--border); border-radius: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size
