)\">\n<span class=\"tile\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ sx.icon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n<span style=\"flex: 1 1 260px; display: flex; flex-direction: column; min-width: 0\">\n<span style=\"font-weight: 500\">{{ sx.label }}<\u002Fspan>\n<span style=\"font-size: 12px; color: var(--muted)\">{{ sx.note }}<\u002Fspan>\n<\u002Fspan>\n<span style=\"flex: 1 1 280px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere\">{{ sx.cmd }}<\u002Fspan>\n<span style=\"flex: 0 0 110px; font-size: 12px; color: var(--ok-t)\">{{ sx.ran }}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ sx.run }}\" style=\"min-height: 36px; padding: 5px 14px; font-size: 12px; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-play\"><\u002Fuse><\u002Fsvg>実行<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fsection>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 16px; align-items: start\">\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 10px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700\">セキュリティ緊急対応<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted)\">Security Critical を検出したら security-emergency Goal で起動します。Goal Router の自動判定でも最優先で選ばれますが、ここから手動で固定できます。<\u002Fp>\n<div><button type=\"button\" class=\"danger\" sc-camel-on-click=\"{{ secEmergency }}\" style=\"min-height: 44px; padding: 8px 18px; font-size: 13px; font-weight: 700; color: #fff; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-alert\"><\u002Fuse><\u002Fsvg>security-emergency で起動（起動画面へ）<\u002Fbutton><\u002Fdiv>\n<span style=\"font-size: 12px; color: var(--muted)\">起動画面で対象プロジェクトを選び、計画（--dry-run）を確認してから実行します。<\u002Fspan>\n<\u002Fsection>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column; gap: 10px\">\n<h2 style=\"margin: 0; font-size: 14px; font-weight: 700\">公開範囲と認証<\u002Fh2>\n<div style=\"display: flex; flex-direction: column\">\n<div style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--border)\">\n<span style=\"font-size: 12px; font-weight: 600; color: var(--muted)\">待ち受け<\u002Fspan>\n<span><span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">127.0.0.1:3740<\u002Fspan>（loopback のみ）<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--border)\">\n<span style=\"font-size: 12px; font-weight: 600; color: var(--muted)\">認証<\u002Fspan>\n<span><span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">STARTUP_WEB_PASSWORD<\u002Fspan> 設定時は Basic 認証。LAN 公開時は必須（fail-closed）<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--border)\">\n<span style=\"font-size: 12px; font-weight: 600; color: var(--muted)\">外部公開<\u002Fspan>\n<span>Cloudflare Tunnel + Access は設計のみ。適用は人間の Y/N 後<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px solid var(--border)\">\n<span style=\"font-size: 12px; font-weight: 600; color: var(--muted)\">操作記録<\u002Fspan>\n<span>変更系操作は監査ログに記録<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div><button type=\"button\" sc-camel-on-click=\"{{ go.audit }}\" style=\"min-height: 40px; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text); background: var(--btn); border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; gap: 6px\"><svg class=\"ic\" aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#i-list\"><\u002Fuse><\u002Fsvg>監査ログを開く<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ 監査ログ ============ -->\n<sc-if value=\"{{ is.audit }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\">\n<h1 style=\"margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px\"><span class=\"tile pop\" aria-hidden=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><use href=\"{{ screenIcon }}\"><\u002Fuse><\u002Fsvg><\u002Fspan>監査ログ<\u002Fh1>\n<p style=\"margin: 0; color: var(--muted)\">変更系操作の記録です。実機では <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px\">~/.claudeos/logs/web-startup-audit.log<\u002Fspan> に追記されます。<\u002Fp>\n<\u002Fdiv>\n<section class=\"card\" style=\"margin: 0; display: flex; flex-direction: column\">\n<div style=\"display: grid; grid-template-columns: 90px 170px minmax(0, 2fr) minmax(0, 1fr); gap: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--muted)\">\n<span>時刻<\u002Fspan><span>操作<\u002Fspan><span>対象<\u002Fspan><span>結果<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{ auditRows }}\" as=\"a\" hint-placeholder-count=\"1\">\n<div style=\"display: grid; grid-template-columns: 90px 170px minmax(0, 2fr) minmax(0, 1fr); gap: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border)\">\n<span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted)\">{{ a.t }}<\u002Fspan>\n<span style=\"font-weight: 500\">{{ a.op }}<\u002Fspan>\n<span style=\"overflow-wrap: anywhere\">{{ a.target }}<\u002Fspan>\n<span style=\"overflow-wrap: anywhere\">{{ a.result }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<sc-if value=\"{{ auditNone }}\" hint-placeholder-val=\"{{ true }}\">\n<p style=\"margin: 0; padding: 12px 10px; color: var(--muted)\">まだ操作はありません。起動・停止・登録などを行うとここに記録されます。<\u002Fp>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;,&quot;auto&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;section&quot;:&quot;表示&quot;},&quot;desktopTerminal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;環境&quot;},&quot;dryRunOnly&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;環境&quot;},&quot;managedMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;disabled&quot;,&quot;dry-run&quot;,&quot;live&quot;],&quot;default&quot;:&quot;dry-run&quot;,&quot;section&quot;:&quot;Managed Agents&quot;},&quot;sampleFailure&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;品質ワークベンチ&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1180}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'launch', theme: '', busy: '', qwBusy: null,\n    chat: {}, pTarget: '', pText: '', pModel: 'auto', pBusy: false, pSeq: 1, pMax: false,\n    filter: '', selected: '', mode: 'background', duration: '', goal: 'auto', intent: '',\n    planKey: '', planText: '',\n    sessions: [],\n    realProjects: null,\n    liveLoaded: false,\n    liveError: '',\n    atRan: {}, atOut: '', saTier: {}, saIssued: {},\n    arComplexity: 'medium', arRisk: 'medium', arParallel: '1', arReadOnly: false, arComm: false, arRanAt: '',\n    extra: { 'IT-BCP-ITSCM-System': 'goal-reached', 'PC-Ops-Orchestrator': 'blocked' },\n    supervised: {},\n    allPlanned: false, allAck: false,\n    cron: [\n      { id: 'c01', project: 'Civil-Draw', time: '21:00', dow: [1, 2, 3, 4, 5, 6], duration: 300, goalType: '' },\n      { id: 'c02', project: 'Synapse-OS', time: '02:30', dow: [0, 3], duration: 120, goalType: 'pr-babysit' }\n    ],\n    cronSeq: 3, cronSel: {},\n    cfProject: '', cfTime: '21:00', cfDow: { 1: true, 2: true, 3: true, 4: true, 5: true, 6: true }, cfDuration: '300', cfGoal: '',\n    units: [\n      { name: 'ITSM-Management', command: 'npm start', enabled: true, active: true },\n      { name: 'Remote-Service-Platform', command: 'npm start', enabled: false, active: false }\n    ],\n    scanOpen: false, scan: ['ServiceHub-Construction-Platform', 'Enterprise-AI-HelpDesk-System'], sdOut: '',\n    maRole: '', maPrompt: '', maUsed: 5, maToday: 0, maLog: [],\n    diagRan: {}, diagOut: '',\n    secRan: {}, secOut: '', dvRan: {}, dvOut: '',\n    qwTarget: '', qwOpts: { allowDirty: false, skipTests: false, skipLint: false, skipBuild: false }, qwRes: {}, qwManual: {},\n    phase: 'development', deployReady: false, weeklyOpen: false, incPrio: 'P3', incText: '', incidents: [],\n    audit: [], confirm: null, notice: null, logFor: ''\n  };\n\n  componentDidMount() {\n    try {\n      const t = window.localStorage.getItem('ccsu-webui-theme');\n      if (t === 'light' || t === 'dark' || t === 'auto') this.setState({ theme: t });\n    } catch (e) { /* storage unavailable: keep the default theme */ }\n    this.refreshLive();\n    this._liveTimer = setInterval(() => this.refreshLive(), 15000);\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    if (!prevState) return;\n    try {\n      const pane = document.querySelector('.pane');\n      if (!pane) return;\n      if (prevState.screen !== this.state.screen) pane.scrollTop = 0;\n      else if (this.state.screen === 'prompt' && prevState.chat !== this.state.chat) {\n        const thread = document.querySelector('.thread');\n        if (thread) thread.scrollTop = thread.scrollHeight;\n      }\n    } catch (e) { /* no scroll container to adjust */ }\n  }\n\n  componentWillUnmount() {\n    (this._timers || []).concat(this._pT || []).forEach((id) => clearTimeout(id));\n    this._timers = [];\n    this._pT = [];\n    if (this._liveTimer) clearInterval(this._liveTimer);\n  }\n\n  later(ms, fn) {\n    this._timers = this._timers || [];\n    this._timers.push(setTimeout(fn, ms));\n  }\n\n  projectNames() {\n    const live = this.state.realProjects;\n    if (Array.isArray(live) && live.length) return live.slice();\n    return ['ArcSphere3D', 'Civil-Construction-IMS', 'Civil-Draw', 'Civil-ITSM-Support', 'CivilPDF-DX', 'ClaudeCode-StartUpTools-New', 'Codex-StartUpTools', 'Codex-StartUpTools-New-Linux', 'Construction-DX-OS', 'Construction-DX-OnePlatform', 'Construction-Enterprise-OS', 'Construction-LegalOps-DX', 'Enterprise-AI-HelpDesk-System', 'IT-BCP-ITSCM-System', 'ITSM-Management', 'Open-BIM-Information-Platform', 'PC-Ops-Orchestrator', 'Remote-Service-Platform', 'ServiceHub-Construction-Platform', 'Synapse-OS', 'Weather-Marine-Construction-Decision-Support-System', 'Windows-Deploy-Management-System'];\n  }\n\n  toolList() {\n    return [\n      ['5', 'ツール確認・診断', 'bash libexec/diag-all-tools.sh'],\n      ['6', 'マウント / ネットワーク疎通診断', 'bash libexec/diag-mounts.sh'],\n      ['7', '端末 / tmux fallback セットアップ', 'bash libexec/setup-terminal.sh'],\n      ['8', 'MCP ヘルスチェック', 'bash libexec/diag-mcp-health.sh'],\n      ['9', 'Agent Teams ランタイム', 'bash libexec/diag-agent-teams.sh'],\n      ['10', 'Worktree Manager', 'bash libexec/diag-worktree.sh'],\n      ['11', 'Architecture Check', 'bash libexec/diag-architecture.sh'],\n      ['12', 'Statusline 設定', 'bash bin/set-statusline.sh'],\n      ['13', 'Claude ログ監視 (tail)', 'bash libexec/watch-claude-log.sh'],\n      ['16', 'Agent Teams Status', 'node scripts/tools/agent-teams-status.js'],\n      ['17', 'Claude Code 互換性 / Capability 診断', 'bash libexec/diag-claude-compat.sh'],\n      ['18', 'Local PostgreSQL 運用診断 (health / backup / drill)', 'bash libexec/diag-postgres.sh'],\n      ['PD', 'Projects Dashboard (進捗 WebUI)', 'bash bin/start-dashboard.sh'],\n      ['MC', 'Mission Control (統合管理)', 'bash bin/start-dashboard.sh --no-browser'],\n      ['DR', 'Dashboard を自動起動に登録 (systemd/cron)', 'bash bin/dashboard-service.sh --register --run-now'],\n      ['DU', 'Dashboard 自動起動を解除', 'bash bin/dashboard-service.sh --unregister']\n    ];\n  }\n\n  now() {\n    const d = new Date();\n    const p = (n) => String(n).padStart(2, '0');\n    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());\n  }\n\n  logged(op, target, result) {\n    return [{ t: this.now(), op: op, target: target, result: result }].concat(this.state.audit).slice(0, 200);\n  }\n\n  fmtMin(n) {\n    if (n === 0) return '無制限';\n    const h = Math.floor(n / 60), m = n % 60;\n    if (h > 0 && m > 0) return h + 'h' + m + 'm';\n    if (h > 0) return h + 'h';\n    return m + 'm';\n  }\n\n  isRunning(name) {\n    return this.state.sessions.some((x) => x.project === name);\n  }\n\n  ask(text, cmd, fn) {\n    this._cf = fn;\n    this.setState({ confirm: { text: text, cmd: cmd } });\n  }\n\n  livePost(url, body) {\n    return fetch(url, {\n      method: 'POST',\n      headers: { 'content-type': 'application/json', accept: 'application/json' },\n      body: JSON.stringify(body || {}),\n    }).then((r) => r.text().then((t) => {\n      try { return JSON.parse(t); } catch (e) { return { ok: false, error: 'BAD_JSON (HTTP ' + r.status + ')' }; }\n    })).catch((e) => ({ ok: false, error: String(e) }));\n  }\n\n  refreshLive() {\n    const get = (u) => fetch(u, { headers: { accept: 'application/json' } })\n      .then((r) => r.json()).catch(() => null);\n    Promise.all([get('/api/startup/state'), get('/api/startup/audit?lines=200')])\n      .then((res) => {\n        const st = res[0], au = res[1];\n        const s0 = (st && st.ok && st.state) ? st.state : null;\n        if (!s0) {\n          this.setState({ liveLoaded: false, liveError: 'state を取得できません' });\n          return;\n        }\n        const folders = Array.isArray(s0.all_folders) ? s0.all_folders : [];\n        const registered = {};\n        (Array.isArray(s0.projects) ? s0.projects : []).forEach((p) => { registered[p.name] = p; });\n        const rows = [];\n        if (au && au.ok && Array.isArray(au.entries)) {\n          au.entries.slice().reverse().forEach((e) => {\n            rows.push({\n              t: String(e.ts || e.time || '').replace('T', ' ').slice(0, 19),\n              op: e.action || e.event || '—',\n              target: e.project || e.session || '—',\n              result: (e.exit === undefined || e.exit === null) ? (e.mode || e.event || '—') : ('exit ' + e.exit),\n            });\n          });\n        }\n        this.setState({\n          realProjects: folders,\n          audit: rows,\n          liveLoaded: true,\n          liveError: '',\n          liveHost: s0.host || '',\n          liveGenerated: s0.generated_at || '',\n        });\n      });\n  }\n\n  stop(project, now, after) {\n    const cmd = 'bash bin/autonomy.sh stop ' + project + (now ? ' --now' : '');\n    const label = now ? '即停止 (--now)' : 'グレースフル停止';\n    this.ask('「' + project + '」を' + label + 'しますか？', cmd, () => {\n      const s = this.state;\n      this.livePost('/api/startup/stop', { project: project, now: !!now }).then((r) => {\n        const ok = !!(r && r.ok);\n        this.setState({ notice: ok\n          ? { tone: 'ok', text: project + ' を停止しました' }\n          : { tone: 'err', text: String((r && (r.error || r.stderr)) || '停止に失敗しました').slice(0, 300) } });\n        this.refreshLive();\n      });\n      this.setState({\n        sessions: s.sessions.filter((x) => x.project !== project),\n        planKey: '', planText: '',\n        logFor: s.logFor === project ? '' : s.logFor,\n        audit: this.logged(now ? '即停止' : '停止', project, 'OK'),\n        notice: { tone: 'ok', text: project + ' を停止しました。' + (after || '') }\n      });\n    });\n  }\n\n  addSessions(names, mode, goal, minutes, op) {\n    const s = this.state;\n    let list = s.sessions.slice();\n    const started = [], skipped = [];\n    names.forEach((n) => {\n      if (list.some((x) => x.project === n)) { skipped.push(n + '（実行中）'); return; }\n      if (list.length >= 4) { skipped.push(n + '（上限到達）'); return; }\n      list.push({ project: n, mode: mode, goal: goal, elapsed: '0m', remain: this.fmtMin(minutes) });\n      started.push(n);\n    });\n    let text = started.length ? '起動しました: ' + started.join(', ') : '起動したセッションはありません。';\n    if (started.length) text += '\\n接続: tmux attach -t ' + (mode === 'team' ? 'claudeos-team-' : 'claudeos-') + started[0];\n    if (skipped.length) text += '\\nskip: ' + skipped.join(', ');\n    this.setState({\n      sessions: list, planKey: '', planText: '',\n      audit: this.logged(op, names.join(', '), started.length ? 'OK (' + started.length + ' 件)' : 'skip'),\n      notice: { tone: started.length ? 'ok' : 'warn', text: text }\n    });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const P = this.props || {};\n    const desktop = P.desktopTerminal ?? true;\n    const dryOnly = P.dryRunOnly ?? false;\n    const maMode = P.managedMode ?? 'dry-run';\n    const SEL = { bg: 'var(--sel-bg)', border: 'var(--sel-bd)' };\n    const OFF = { bg: 'var(--sub)', border: 'var(--border)' };\n    const all = this.projectNames();\n\n    /* ---- navigation ---- */\n    const screens = ['launch', 'prompt', 'sessions', 'applyall', 'cron', 'systemd', 'teams', 'subagents', 'managed', 'diag', 'quality', 'deploy', 'secops', 'audit'];\n    const names = { prompt: 'セッション', teams: 'Agent Teams 管理', subagents: 'SubAgent 管理', quality: '品質ワークベンチ', secops: 'SecOps', launch: '起動', sessions: 'セッション状態監視', applyall: 'Supervisor 全適用', cron: 'Cron スケジュール', systemd: 'Systemd 起動管理', managed: 'Managed Agents', diag: '診断・ツール', deploy: 'DevOps', audit: '監査ログ' };\n    const go = {}, is = {}, nav = {};\n    screens.forEach((k) => {\n      go[k] = () => this.setState({ screen: k });\n      is[k] = s.screen === k;\n      nav[k] = is[k] ? { bg: '
