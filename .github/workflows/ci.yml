name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Linux test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck jq tmux

      - name: Install npm metadata
        run: npm install --package-lock-only

      - name: Run bats and Node tests
        run: npm test

      - name: Run dry-run validation
        # npm test の対象外にある既存 dry-run マトリクス (33 項目) の回帰
        run: npm run test:dry-run

      - name: Run shell lint
        run: npm run lint

      - name: Run shell lint (release / e2e scripts)
        # npm run lint の glob 外にある昇格 / スモーク用スクリプトも検証する
        run: shellcheck -S error scripts/release/*.sh scripts/e2e/*.sh

      - name: Adversarial probe (policy surface)
        # Agent ポリシーの攻撃耐性を期待判定と突き合わせる (自作ハーネス)
        run: bash bin/adversarial-probe.sh run --json

      - name: Agent policy matrix
        # deny-by-default の判定分布を記録する (回帰の目視用)
        run: bash bin/policy-check.sh matrix --json | jq -c '[.[]|.decision]|group_by(.)|map({(.[0]):length})|add'

      - name: Formal verification (TLA+/TLC)
        # run-ledger の状態機械モデルをモデル検査する。tla2tools.jar は初回のみ取得
        run: bash scripts/tools/tla-check.sh run --json

  e2e-console:
    # 統合コンソールを実ブラウザで検証する (画面ごとに API の実値と DOM を突き合わせる)。
    # CI にはプロジェクトが無いため E2E_ALLOW_EMPTY=1 で「0 件でも API と一致していること」を検査する。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install tools for the console server
        run: |
          sudo apt-get update
          sudo apt-get install -y jq tmux cron

      - name: Install Playwright (not saved to package.json)
        # 依存ゼロの方針を保つため --no-save。ブラウザは chromium のみ。
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Start the console server
        run: |
          node scripts/web/startup-server.js --port 3740 --host 127.0.0.1 --allow-no-auth > /tmp/console.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3740/api/health > /dev/null 2>&1; then echo "server up"; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3740/api/health || { cat /tmp/console.log; exit 1; }

      - name: Run Playwright console checks
        env:
          CONSOLE_URL: http://127.0.0.1:3740
          E2E_ALLOW_EMPTY: "1"
        run: node scripts/e2e/console.e2e.js

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-console
          path: reports/e2e/
          if-no-files-found: ignore

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/console.log || true

  staging-smoke:
    # リリース成果物から起動し、毎回まっさらな CLAUDEOS_HOME へ分離した状態で
    # health / 静的 UI / 保護 API / 監査ログを検証する (本番 3740 は触らない)。
    needs: linux-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install smoke test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq tmux

      - name: Run staging smoke
        # --json の最終行が結果。pipefail でスクリプトの exit code を保持する。
        run: |
          set -o pipefail
          bash scripts/e2e/staging-smoke.sh --json 2>&1 | tee /tmp/staging-smoke.log

      - name: Upload staging smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: staging-smoke
          path: /tmp/staging-smoke.log
          if-no-files-found: ignore

  release-artifact:
    # リリース成果物をビルドし、独立実装 (verify-artifact) で manifest の
    # sha256 / size / tree_sha256 を再検証して成果物の同一性を回帰させる。
    needs: linux-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Build release artifact
        env:
          CLAUDEOS_HOME: ${{ runner.temp }}
        run: |
          set -o pipefail
          bash bin/release-build.sh --ref HEAD --out "$RUNNER_TEMP/app" --json 2>&1 | tee /tmp/release-build.log

      - name: Verify release artifact
        run: |
          set -o pipefail
          bash scripts/release/verify-artifact.sh "$RUNNER_TEMP/app" --json 2>&1 | tee /tmp/verify-artifact.log

      - name: Upload artifact logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: release-artifact
          path: |
            /tmp/release-build.log
            /tmp/verify-artifact.log
          if-no-files-found: ignore
