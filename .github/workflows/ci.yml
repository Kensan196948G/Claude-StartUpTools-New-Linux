name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Linux test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck jq tmux

      - name: Install npm metadata
        run: npm install --package-lock-only

      - name: Run bats and Node tests
        run: npm test

      - name: Run shell lint
        run: npm run lint
