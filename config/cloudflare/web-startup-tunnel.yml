# Cloudflare Tunnel 設定 (cloudflared) — Web スタートアップコンソール公開用
#
# 適用は人間の Y/N 後（docs/architecture/WEB_STARTUP_PUBLIC_ACCESS.md §4）。
# このファイルは repo 管理下のテンプレートで、実機では ~/.cloudflared/claude-startuptools-config.yml へ
# コピーして <TUNNEL_ID> を埋める。値はここに書かない (secret/ID を commit しない)。
#
# 設計方針 (docs/architecture/Cloudflare公開基盤仕様.md §5):
#   - コンソールは 127.0.0.1:3740 のまま (LAN へ bind しない)。cloudflared が同一ホストから
#     loopback へ接続するため、公開面は Cloudflare エッジのみになる。
#   - 入口制御は Cloudflare Access (認証は Access、アプリ側 Basic は多層防御)。
#   - DNS / custom domain / Access policy の変更は Approval PR (人間 Y/N)。
#
# 手順 (人間が実行):
#   cloudflared tunnel login
#   cloudflared tunnel create claude-startuptools      # → <TUNNEL_ID> を控える
#   cp config/cloudflare/web-startup-tunnel.yml ~/.cloudflared/claude-startuptools-config.yml   # <TUNNEL_ID> を置換
#   cloudflared tunnel route dns claude-startuptools claude-startuptools.mirai-dx-platform.com
#   cloudflared tunnel --config ~/.cloudflared/claude-startuptools-config.yml run

tunnel: <TUNNEL_ID>
credentials-file: /home/kensan/.cloudflared/<TUNNEL_ID>.json

# cloudflared 自体のログ (認証情報は含めない)
loglevel: info
logfile: /home/kensan/.claudeos/logs/cloudflared-web-startup.log

originRequest:
  connectTimeout: 10s
  # ローカル origin は http。TLS 検証の緩和は行わない。
  noTLSVerify: false

ingress:
  # ブラウザターミナル (ttyd + bin/web-terminal.sh)。path 前方一致で /terminal を保持して 3741 へ。
  # 同一 hostname なので既存 Access application がそのまま保護する。
  - hostname: claude-startuptools.mirai-dx-platform.com
    path: ^/terminal
    service: http://127.0.0.1:3741

  # 公開ルートは統合コンソール v2 (scripts/web/public/v2.html)。
  # systemd --user claudeos-web-startup.service が 127.0.0.1:3740 で待ち受け、
  # `/` は v2.html、`/api/startup/*` は実 API、旧コンソールは /index.html で残る。
  # Access application はこの hostname 単位で / と /terminal の両方を保護する
  # (config/cloudflare/web-startup-access-policy.json)。
  - hostname: claude-startuptools.mirai-dx-platform.com
    service: http://127.0.0.1:3740

  # 既存の別サービスがある場合はここへ追記する (このテンプレートは単一サービスのみ)。

  # catch-all は必ず最後 (未定義 hostname を 404 で閉じる = fail closed)
  - service: http_status:404
