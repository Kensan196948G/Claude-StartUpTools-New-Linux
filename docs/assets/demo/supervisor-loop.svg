<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Supervisor の動き: 起動 → 実行 → 判定 → Goal 到達で停止、未達なら再開">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d18"/><stop offset="1" stop-color="#101a2e"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#182640"/><stop offset="1" stop-color="#0e1728"/></linearGradient>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="aB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9dff"/></marker>
  <marker id="aP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker>
  <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f0655f"/></marker>
  <style>
    .t { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif; }
    .flow { stroke: #3f7fd6; stroke-width: 2.4; fill: none; stroke-dasharray: 7 9; animation: dash 1.1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -16; } }
    .back { stroke: #a371f7; stroke-width: 2.2; fill: none; stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
    .stop { stroke: #f0655f; stroke-width: 2.2; fill: none; stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .live { animation: blink 2.4s ease-in-out infinite; }
  </style>
</defs>
<rect width="1000" height="340" rx="18" fill="url(#bg)"/>
<rect x="0.6" y="0.6" width="998.8" height="338.8" rx="18" fill="none" stroke="#1d2c47"/>
<text class="t" x="30" y="44" font-size="21" font-weight="700" fill="#eaf2ff">Supervisor の動き（S1）</text>
<text class="t" x="30" y="68" font-size="12.5" fill="#8ea6c8">セッションが終わるたびに判定し、まだ Goal に届いていなければ起こし直す。</text>

<g><rect x="40" y="118" width="170" height="68" rx="12" fill="url(#card)" stroke="#24395c" stroke-width="1.2"/><rect x="40" y="118" width="4" height="68" rx="2" fill="#58a6ff"/><text class="t" x="56" y="146" font-size="17">🚀</text><text class="t" x="82" y="143" font-size="14.5" font-weight="700" fill="#eaf2ff">起動</text><text class="t" x="56" y="168" font-size="11" fill="#93a9c8">S1 で開始</text></g>
<g><rect x="285" y="118" width="170" height="68" rx="12" fill="url(#card)" stroke="#24395c" stroke-width="1.2"/><rect x="285" y="118" width="4" height="68" rx="2" fill="#3fb950"/><text class="t" x="301" y="146" font-size="17">🧠</text><text class="t" x="327" y="143" font-size="14.5" font-weight="700" fill="#eaf2ff">実行</text><text class="t" x="301" y="168" font-size="11" fill="#93a9c8">Claude Code</text></g>
<g><rect x="530" y="118" width="170" height="68" rx="12" fill="url(#card)" stroke="#24395c" stroke-width="1.2"/><rect x="530" y="118" width="4" height="68" rx="2" fill="#f4b942"/><text class="t" x="546" y="146" font-size="17">🔍</text><text class="t" x="572" y="143" font-size="14.5" font-weight="700" fill="#eaf2ff">判定</text><text class="t" x="546" y="168" font-size="11" fill="#93a9c8">終了ごとに確認</text></g>
<g><rect x="770" y="86" width="200" height="68" rx="12" fill="url(#card)" stroke="#24395c" stroke-width="1.2"/><rect x="770" y="86" width="4" height="68" rx="2" fill="#f0655f"/><text class="t" x="786" y="114" font-size="17">🛑</text><text class="t" x="812" y="111" font-size="14.5" font-weight="700" fill="#eaf2ff">停止して人間へ</text><text class="t" x="786" y="136" font-size="11" fill="#93a9c8">Goal 到達 / 上限</text></g>
<path class="flow" d="M212,152 L279,152" marker-end="url(#aB)"/>
<path class="flow" d="M457,152 L524,152" marker-end="url(#aB)"/>
<path class="flow" d="M702,152 C740,152 742,120 764,120" marker-end="url(#aR)"/>
<text class="t" x="706" y="180" font-size="11" fill="#e08580">達成 / 上限</text>
<path class="back" d="M615,188 C615,238 125,238 125,190" marker-end="url(#aP)"/>
<rect x="300" y="214" width="150" height="28" rx="14" fill="#101c31" stroke="#2b2140"/>
<text class="t" x="375" y="233" font-size="11.5" text-anchor="middle" fill="#c4a9f7">30 秒後に自動で再開</text>
<circle r="4" fill="#7fd3ff" filter="url(#soft)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M212,152 L279,152"/></circle>
<circle r="4" fill="#7fd3ff" filter="url(#soft)"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M457,152 L524,152"/></circle>
<circle r="4" fill="#c4a9f7" filter="url(#soft)"><animateMotion dur="4.4s" begin="2s" repeatCount="indefinite" path="M615,188 C615,238 125,238 125,190"/></circle>
<rect x="40" y="288" width="199" height="30" rx="15" fill="#0d1829" stroke="#22344f"/>
<text class="t" x="54" y="309" font-size="12">⏱️</text>
<text class="t" x="76" y="309" font-size="11.5" fill="#9fb6d4">1 セッション 300 分</text>
<rect x="251" y="288" width="173" height="30" rx="15" fill="#0d1829" stroke="#22344f"/>
<text class="t" x="265" y="309" font-size="12">📅</text>
<text class="t" x="287" y="309" font-size="11.5" fill="#9fb6d4">1 日 600 分まで</text>
<rect x="436" y="288" width="186" height="30" rx="15" fill="#0d1829" stroke="#22344f"/>
<text class="t" x="450" y="309" font-size="12">🔁</text>
<text class="t" x="472" y="309" font-size="11.5" fill="#9fb6d4">再起動は 1 日 1 回</text>
<rect x="634" y="288" width="342" height="30" rx="15" fill="#0d1829" stroke="#22344f"/>
<text class="t" x="648" y="309" font-size="12">💥</text>
<text class="t" x="670" y="309" font-size="11.5" fill="#9fb6d4">120 秒で 3 連続 → crash-loop</text>
</svg>