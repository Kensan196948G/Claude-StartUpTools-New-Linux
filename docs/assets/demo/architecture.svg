<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="ClaudeOS 全体アーキテクチャ: 人間 → 入口 → 起動 → Supervisor → Claude Code → GitHub / CI。公開と merge は Human Gate">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d18"/><stop offset="1" stop-color="#101a2e"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#182640"/><stop offset="1" stop-color="#0e1728"/></linearGradient>
  <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#211a0c"/><stop offset="1" stop-color="#171326"/></linearGradient>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9dff"/></marker>
  <marker id="arrowP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a371f7"/></marker>
  <style>
    .t { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif; }
    .flow { stroke: #3f7fd6; stroke-width: 2.4; fill: none; stroke-dasharray: 7 9; animation: dash 1.1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -16; } }
    .loop { stroke: #a371f7; stroke-width: 2.2; fill: none; stroke-dasharray: 6 8; animation: dash 1.3s linear infinite; }
    .stat { fill: #101c31; stroke: #1f3352; stroke-width: 1; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .live { animation: blink 2.6s ease-in-out infinite; }
    @keyframes beat { 0%,100% { transform: scale(1); } 14% { transform: scale(1.08); } 28% { transform: scale(1); } }
    .hb { animation: beat 1.8s ease-in-out infinite; }
    @keyframes sheen { 0%,100% { opacity: 0; } 50% { opacity: .07; } }
    .sheen { animation: sheen 6s ease-in-out infinite; }
  </style>
</defs>
<rect width="1200" height="470" rx="18" fill="url(#bg)"/>
<rect x="0.6" y="0.6" width="1198.8" height="468.8" rx="18" fill="none" stroke="#1d2c47"/>
<text class="t" x="34" y="50" font-size="23" font-weight="700" fill="#eaf2ff">ClaudeOS 全体像</text>
<text class="t" x="34" y="76" font-size="13.5" fill="#8ea6c8">人が起点。起動・監視・再開は自動。公開や merge の最終判断だけ人が持つ。</text>
<circle class="live" cx="1014" cy="45" r="5" fill="#3fb950"/>
<text class="t" x="1028" y="50" font-size="12.5" fill="#6f8aad">v4.0.0-linux · Linux ローカル</text>

<path class="flow" d="M200,202.0 L224,202.0" marker-end="url(#arrow)"/>
<circle class="dot" r="3.4" fill="#7fd3ff" filter="url(#soft)"><animateMotion dur="2.20s" repeatCount="indefinite" path="M200,202.0 L224,202.0"/></circle>
<path class="flow" d="M398,202.0 L422,202.0" marker-end="url(#arrow)"/>
<circle class="dot" r="3.4" fill="#7fd3ff" filter="url(#soft)"><animateMotion dur="2.40s" repeatCount="indefinite" path="M398,202.0 L422,202.0"/></circle>
<path class="flow" d="M596,202.0 L620,202.0" marker-end="url(#arrow)"/>
<circle class="dot" r="3.4" fill="#7fd3ff" filter="url(#soft)"><animateMotion dur="2.60s" repeatCount="indefinite" path="M596,202.0 L620,202.0"/></circle>
<path class="flow" d="M794,202.0 L818,202.0" marker-end="url(#arrow)"/>
<circle class="dot" r="3.4" fill="#7fd3ff" filter="url(#soft)"><animateMotion dur="2.80s" repeatCount="indefinite" path="M794,202.0 L818,202.0"/></circle>
<path class="flow" d="M992,202.0 L1016,202.0" marker-end="url(#arrow)"/>
<circle class="dot" r="3.4" fill="#7fd3ff" filter="url(#soft)"><animateMotion dur="3.00s" repeatCount="indefinite" path="M992,202.0 L1016,202.0"/></circle>
<g><rect x="30" y="150" width="168" height="104" rx="14" fill="url(#card)" stroke="#24395c" stroke-width="1.2"/>
<rect x="30" y="150" width="4" height="104" rx="2" fill="#f4b942"/>
<text class="t" x="48" y="194" font-size="21">🧍</text>
<text class="t" x="78" y="188" font-size="16" font-weight="700" fill="#eaf2ff">人間</text>
<text class="t" x="48" y="222" font-size="11.5" fill="#93a9c8">選ぶ・承認する</text>
</g>
<g><rect x="228" y="150" width="168" height="104" rx="14" fill="url(#card)" stroke="#24395c" stroke-width="1.2"/>
<rect x="228" y="150" width="4" height="104" rx="2" fill="#58a6ff"/>
<text class="t" x="246" y="194" font-size="21">🎛️</text>
<text class="t" x="276" y="188" font-size="16" font-weight="700" fill="#eaf2ff">入口</text>
<text class="t" x="246" y="222" font-size="11.5" fill="#93a9c8">CLI メニュー / Web コンソール</text>
</g>
<g><rect x="426" y="150" width="168" height="104" rx="14" fill="url(#card)" stroke="#24395c" stroke-width="1.2"/>
<rect x="426" y="150" width="4" height="104" rx="2" fill="#58a6ff"/>
<text class="t" x="444" y="194" font-size="21">🚀</text>
<text class="t" x="474" y="188" font-size="16" font-weight="700" fill="#eaf2ff">起動</text>
<text class="t" x="444" y="222" font-size="11.5" fill="#93a9c8">L1 · T1 · S1 モード</text>
</g>
<g><rect x="624" y="150" width="168" height="104" rx="14" fill="url(#card)" stroke="#24395c" stroke-width="1.2"/>
<rect x="624" y="150" width="4" height="104" rx="2" fill="#a371f7"/>
<text class="t" x="642" y="194" font-size="21">🧩</text>
<text class="t" x="672" y="188" font-size="16" font-weight="700" fill="#eaf2ff">Supervisor</text>
<text class="t" x="642" y="222" font-size="11.5" fill="#93a9c8">Goal 到達まで自動で再開</text>
</g>
<g><rect x="822" y="150" width="168" height="104" rx="14" fill="url(#card)" stroke="#24395c" stroke-width="1.2"/>
<rect x="822" y="150" width="4" height="104" rx="2" fill="#3fb950"/>
<text class="t" x="840" y="194" font-size="21">🧠</text>
<text class="t" x="870" y="188" font-size="16" font-weight="700" fill="#eaf2ff">Claude Code</text>
<text class="t" x="840" y="222" font-size="11.5" fill="#93a9c8">実装・テスト・PR を実行</text>
</g>
<g><rect x="1020" y="150" width="168" height="104" rx="14" fill="url(#card)" stroke="#24395c" stroke-width="1.2"/>
<rect x="1020" y="150" width="4" height="104" rx="2" fill="#3fb950"/>
<text class="t" x="1038" y="194" font-size="21">🐙</text>
<text class="t" x="1068" y="188" font-size="16" font-weight="700" fill="#eaf2ff">GitHub / CI</text>
<text class="t" x="1038" y="222" font-size="11.5" fill="#93a9c8">レビューと検証</text>
</g>
<path class="loop" d="M708.0,256 C708.0,320 510.0,320 510.0,262" marker-end="url(#arrowP)"/>
<rect class="stat" x="544.0" y="300" width="196" height="30" rx="15"/>
<text class="t" x="642.0" y="320" font-size="12" text-anchor="middle" fill="#c4a9f7">未達なら自動で再起動</text>
<g><rect x="30" y="366" width="1140" height="74" rx="14" fill="url(#gate)" stroke="#7a5f22" stroke-width="1.2"/>
<rect class="sheen" x="30" y="366" width="1140" height="74" rx="14" fill="#ffcc55"/>
<text class="t" x="52" y="397" font-size="16" font-weight="700" fill="#ffd479">✋ Human Gate（人が決める）</text>
<text class="t" x="52" y="421" font-size="12.5" fill="#e0cda6">本番公開 · merge / main 直 push · Secrets · 課金 · 破壊的削除 · Supervisor 全適用の最終実行</text>
<g class="hb" transform-origin="1092 403"><circle cx="1092" cy="403" r="18" fill="none" stroke="#ffd479" stroke-width="1.5" opacity=".75"/><text class="t" x="1092" y="409" font-size="18" text-anchor="middle">🧍</text></g></g>
</svg>