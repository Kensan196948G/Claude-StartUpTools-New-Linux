# 提案: BLB-Safe-Renamer の最小 CI
#
# 根拠（2026-11-23 実測）:
#   languages = PowerShell 9551 B / JavaScript 6439 B / Batchfile 701 B
#   ルート     = Rename-BlbSafe.ps1, run_precheck.bat, run_execute.bat, scripts/tools/run-ultrareview.js
#   テスト無し。package.json 等のマニフェストも無い
#
# 方針: テストが無い repo なので、構文検査のみを最小 CI とする。
#
# 採用コマンド（実在を確認済み）:
#   [System.Management.Automation.Language.Parser]::ParseFile … .ps1 の構文検査（追加モジュール不要）
#   node --check scripts/tools/run-ultrareview.js             … .js の構文検査
#   Batchfile (.bat) は GitHub Actions のランナーで静的検査する手段が無いため対象外
#
# 将来: テストを足したら、この job に step を追加する（job 名 ci は変えない＝必須チェック名を保つ）。

name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript 構文検査
        run: node --check scripts/tools/run-ultrareview.js

      - name: PowerShell 構文検査
        shell: pwsh
        run: |
          $failed = $false
          $count = 0
          Get-ChildItem -Path . -Recurse -Filter *.ps1 -File | ForEach-Object {
            $file = $_
            $count++
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                $line = $e.Extent.StartLineNumber
                Write-Host "::error file=$($file.Name),line=$line::$($e.Message)"
              }
            }
          }
          Write-Host "検査した .ps1: $count 件"
          if ($failed) { exit 1 }
